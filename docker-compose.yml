services:
  secp-postgres:
    image: pgvector/pgvector:pg16
    container_name: secp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secp_pass}
      POSTGRES_DB: ${POSTGRES_DB:-secp_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - secp_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init_extensions.sql:/docker-entrypoint-initdb.d/01_init_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secp_user} -d ${POSTGRES_DB:-secp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  secp-redis:
    image: redis:7-alpine
    container_name: secp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - secp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  secp_postgres_data:
  secp_redis_data:
