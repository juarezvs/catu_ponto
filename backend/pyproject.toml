[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secp-backend"
version = "2.0.0"
description = "SECP - Sistema de Controle e Processos | Backend Python em Arquitetura Hexagonal com PostgreSQL (pgvector) e Redis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
